<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <circle cx="40" cy="40" r="39" fill="#F6EFD8" stroke="#B5964D" stroke-width="2"/>
  <!-- Éventail de 3 affiches — pivot bas-centre (40,52), dessinées de l'arrière vers l'avant -->
  <!-- fill=#F6EFD8 = fond badge : les affiches se masquent proprement à l'intersection -->
  <rect x="33" y="28" width="14" height="24" rx="2" fill="#F6EFD8" stroke="#B5964D" stroke-width="2" transform="rotate(-22, 40, 52)"/>
  <rect x="33" y="28" width="14" height="24" rx="2" fill="#F6EFD8" stroke="#B5964D" stroke-width="2" transform="rotate(22, 40, 52)"/>
  <rect x="33" y="28" width="14" height="24" rx="2" fill="#F6EFD8" stroke="#B5964D" stroke-width="2" transform="rotate(0, 40, 52)"/>
</svg>
