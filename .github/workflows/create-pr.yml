name: Create PR

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'

jobs:
  create-pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "$BRANCH" \
            --body "PR generee automatiquement apres succes CI.

          **Branche :** \`$BRANCH\`
          **Commit :** \`$SHA\`

          Relire les commits avant de merger." \
          || echo "PR already exists or branch is up to date, skipping."
