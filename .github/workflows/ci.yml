name: CI

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collec
          POSTGRES_PASSWORD: collec_test
          POSTGRES_DB: collec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Build check
        run: pnpm build
        env:
          DATABASE_URI: postgresql://collec:collec_test@localhost:5432/collec_test
          PAYLOAD_SECRET: ci-test-secret-min-32-chars-for-build
