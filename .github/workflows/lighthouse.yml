name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collec
          POSTGRES_PASSWORD: collec_test
          POSTGRES_DB: collec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          DATABASE_URI: postgresql://collec:collec_test@localhost:5432/collec_test
          PAYLOAD_SECRET: ci-test-secret-min-32-chars-for-build

      - name: Start server
        run: pnpm start &
        env:
          DATABASE_URI: postgresql://collec:collec_test@localhost:5432/collec_test
          PAYLOAD_SECRET: ci-test-secret-min-32-chars-for-build
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
